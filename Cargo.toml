[workspace]
resolver = "2"
members = [
    "crates/vesper-format",
    "crates/vesper-meta",
    "crates/vesper-fetch",
    "crates/vesper-install",
    "crates/vesper-cli",
    "crates/vesper-client",
    "crates/vesper-publish",
]

[workspace.package]
version = "0.7.1"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.99"
publish = false

[workspace.dependencies]
anyhow = "1.0"
aes-gcm = "0.10"
blake3 = "1.5"
ciborium = "0.2"
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
fastcdc = "3.1"
hex = "0.4"
hkdf = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tempfile = "3.23"
tokio = { version = "1", features = ["rt", "time", "fs", "io-util"] }
futures-util = "0.3"
urlencoding = "2.1"
unicode-normalization = "0.1"
walkdir = "2.5"
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem", "Win32_Security_Credentials", "Win32_System_RestartManager", "Win32_System_SystemInformation"] }
zstd = "0.13"
