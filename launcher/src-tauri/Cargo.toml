[package]
publish = false
name = "vesper-launcher"
version = "0.1.0"
description = "Vesper Windows game launcher"
authors = ["Baryon Interactive"]
edition = "2021"
rust-version = "1.99"

[workspace]

[build-dependencies]
tauri-build = { version = "2.3", features = [] }

[dependencies]
anyhow = "1.0"
vesper-client = { path = "../../crates/vesper-client" }
serde_json = "1.0"
tauri = { version = "2.3", features = [] }
tauri-plugin-updater = "2.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
