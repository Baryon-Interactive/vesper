name: release

on:
  push:
    tags: ["vesper-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.99.1"
  # The release version: must equal the workspace version and the vesper-v tag.
  VESPER_VERSION: "0.7.1"

jobs:
  linux-cli:
    runs-on: ubuntu-latest
    container: rust:1.99.1-alpine@sha256:44819b27be4c97b0e4d7203bd2e02c4820f97700211b6a37fb4c246a2de59383
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set source commit
        shell: sh
        run: echo "VESPER_GIT_SHA=${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
      - name: Build static Linux CLI
        shell: sh
        run: |
          set -eu
          apk info -e musl-dev binutils >/dev/null
          cargo build --release --locked -p vesper-cli --bin vesper --target x86_64-unknown-linux-musl
          strip target/x86_64-unknown-linux-musl/release/vesper
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/vesper dist/vesper-cli-linux-x64
      - name: Assert CLI version
        shell: sh
        run: test "$(dist/vesper-cli-linux-x64 --version)" = "vesper $VESPER_VERSION ($VESPER_GIT_SHA)"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-linux-cli
          path: dist/vesper-cli-linux-x64
          if-no-files-found: error

  windows-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Rust toolchain
        shell: pwsh
        run: rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
      - name: Set source commit
        shell: pwsh
        run: |
          "VESPER_GIT_SHA=$($env:GITHUB_SHA.Substring(0, 12))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Windows CLI
        shell: pwsh
        run: |
          cargo +$env:RUST_TOOLCHAIN build --release --locked -p vesper-cli --bin vesper
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/vesper.exe dist/vesper-cli-windows-x64.exe
      - name: Assert CLI version
        shell: pwsh
        run: |
          $actual = (& dist/vesper-cli-windows-x64.exe --version).Trim()
          if ($actual -ne "vesper $($env:VESPER_VERSION) ($env:VESPER_GIT_SHA)") { throw "Unexpected CLI version: $actual" }
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-windows-cli
          path: dist/vesper-cli-windows-x64.exe
          if-no-files-found: error

  macos-cli-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Set source commit
        shell: bash
        run: echo "VESPER_GIT_SHA=${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
      - name: Build native macOS arm64 CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo +"$RUST_TOOLCHAIN" build --release --locked -p vesper-cli --bin vesper
          mkdir -p dist
          cp target/release/vesper dist/vesper-cli-macos-arm64
      - name: Assert CLI version
        shell: bash
        run: test "$(dist/vesper-cli-macos-arm64 --version)" = "vesper $VESPER_VERSION ($VESPER_GIT_SHA)"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-macos-arm64-cli
          path: dist/vesper-cli-macos-arm64
          if-no-files-found: error

  macos-cli-x64:
    # macos-latest is arm64; the x64 binary is an explicit cross-target on the same runner.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Set source commit
        shell: bash
        run: echo "VESPER_GIT_SHA=${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
      - name: Build native macOS x64 CLI
        shell: bash
        run: |
          set -euo pipefail
          rustup target add x86_64-apple-darwin --toolchain "$RUST_TOOLCHAIN"
          cargo +"$RUST_TOOLCHAIN" build --release --locked -p vesper-cli --bin vesper --target x86_64-apple-darwin
          mkdir -p dist
          cp target/x86_64-apple-darwin/release/vesper dist/vesper-cli-macos-x64
      - name: Assert CLI version
        shell: bash
        run: test "$(dist/vesper-cli-macos-x64 --version)" = "vesper $VESPER_VERSION ($VESPER_GIT_SHA)"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-macos-x64-cli
          path: dist/vesper-cli-macos-x64
          if-no-files-found: error

  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - name: Select Rust toolchain
        shell: pwsh
        run: rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
      - name: Build frontend
        shell: pwsh
        run: |
          npm --prefix launcher ci
          npm --prefix launcher run build
      - name: Build unsigned NSIS installer
        shell: pwsh
        run: |
          Push-Location launcher
          npx tauri build --bundles nsis
          Pop-Location
          $source = Get-ChildItem launcher/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $source) { throw 'Tauri did not produce an NSIS installer' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $source.FullName "dist/Vesper-Setup-$($env:VESPER_VERSION)-windows-x64.exe"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-windows-client
          path: dist/Vesper-Setup-${{ env.VESPER_VERSION }}-windows-x64.exe
          if-no-files-found: error

  macos-client:
    # One universal app for Apple Silicon and Intel Macs, ad-hoc signed (not notarized).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - name: Select Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUST_TOOLCHAIN" aarch64-apple-darwin x86_64-apple-darwin
      - name: Test client crates on macOS
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" test --locked -p vesper-client -p vesper-format -p vesper-install
      - name: Build frontend
        shell: bash
        run: |
          npm --prefix launcher ci
          npm --prefix launcher run build
      - name: Build universal disk image
        shell: bash
        run: |
          set -euo pipefail
          # Request "app" too: with dmg alone Tauri deletes Vesper.app after packing it.
          (cd launcher && npx tauri build --target universal-apple-darwin --bundles app,dmg)
          bundle=launcher/src-tauri/target/universal-apple-darwin/release/bundle
          app="$bundle/macos/Vesper.app"
          exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          archs=$(lipo -archs "$app/Contents/MacOS/$exe")
          echo "app architectures: $archs"
          [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]]
          dmgs=("$bundle"/dmg/*.dmg)
          dmg="${dmgs[0]}"
          test -f "$dmg"
          mkdir -p dist
          cp "$dmg" "dist/Vesper-$VESPER_VERSION-macos-universal.dmg"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-macos-client
          path: dist/Vesper-${{ env.VESPER_VERSION }}-macos-universal.dmg
          if-no-files-found: error

  linux-client:
    # Built on the oldest supported Ubuntu so the AppImage runs on older glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install system packages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file build-essential
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - name: Select Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Test client crates on Linux
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" test --locked -p vesper-client -p vesper-format -p vesper-install
      - name: Build frontend
        shell: bash
        run: |
          npm --prefix launcher ci
          npm --prefix launcher run build
      - name: Build AppImage and Debian package
        shell: bash
        run: |
          set -euo pipefail
          (cd launcher && npx tauri build --bundles appimage,deb)
          bundle=launcher/src-tauri/target/release/bundle
          appimages=("$bundle"/appimage/*.AppImage)
          debs=("$bundle"/deb/*.deb)
          appimage="${appimages[0]}"
          deb="${debs[0]}"
          test -f "$appimage" && test -f "$deb"
          # Capture output before matching: under pipefail, piping into a grep that quits early kills the writer (SIGPIPE).
          kind=$(file -b "$appimage")
          echo "AppImage: $kind"
          [[ "$kind" == *"ELF 64-bit"* ]]
          contents=$(dpkg-deb --contents "$deb")
          # Tauri's deb writer may store paths with or without a leading "./". grep without -q reads all
          # input, prints the launcher path, and fails if none is found; then show the listing to diagnose.
          awk '{print $NF}' <<< "$contents" | grep -E '^(\./)?usr/bin/[^/]+$' \
            || { echo "no executable under usr/bin; package listing:"; head -n 40 <<< "$contents"; exit 1; }
          mkdir -p dist
          cp "$appimage" "dist/Vesper-$VESPER_VERSION-linux-x64.AppImage"
          cp "$deb" "dist/Vesper-$VESPER_VERSION-linux-x64.deb"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-linux-client
          path: |
            dist/Vesper-${{ env.VESPER_VERSION }}-linux-x64.AppImage
            dist/Vesper-${{ env.VESPER_VERSION }}-linux-x64.deb
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/vesper-v')
    needs: [linux-cli, windows-cli, macos-cli-arm64, macos-cli-x64, windows-client, macos-client, linux-client]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check tag matches workspace version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#vesper-v}"
          workspace_version=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("Cargo.toml").read_text(encoding="utf-8")
          section = text.split("[workspace.package]", 1)[1].split("[", 1)[0]
          print(re.search(r'^version\s*=\s*"([^"]+)"', section, re.MULTILINE).group(1))
          PY
          )
          test "$tag_version" = "$workspace_version"
          test "$workspace_version" = "$VESPER_VERSION"
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Add notices and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp LICENSE NOTICE dist/
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum) > dist/SHA256SUMS
          test "$(wc -l < dist/SHA256SUMS)" -eq 10
          # Each line is "<64 hex>  <name>": match whole lines, not bare names.
          # Compare names literally (awk string equality), so a "." in the version is not a wildcard.
          for name in "Vesper-Setup-$VESPER_VERSION-windows-x64.exe" \
              "Vesper-$VESPER_VERSION-macos-universal.dmg" \
              "Vesper-$VESPER_VERSION-linux-x64.AppImage" "Vesper-$VESPER_VERSION-linux-x64.deb" \
              vesper-cli-linux-x64 vesper-cli-windows-x64.exe vesper-cli-macos-arm64 vesper-cli-macos-x64 \
              LICENSE NOTICE; do
            awk -v n="$name" 'NF == 2 && length($1) == 64 && $1 ~ /^[0-9a-f]+$/ && $2 == n { found = 1 } END { exit !found }' dist/SHA256SUMS \
              || { echo "missing $name"; exit 1; }
          done
      - name: Fill release notes
        shell: bash
        run: |
          set -euo pipefail
          sed -e "s/@VERSION@/${GITHUB_REF_NAME#vesper-v}/g" \
              -e "s/@COMMIT@/${GITHUB_SHA}/g" \
              scripts/release-notes.md > release-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh release create "$GITHUB_REF_NAME" --target "$GITHUB_SHA"
          --title "Vesper ${GITHUB_REF_NAME#vesper-v}" --notes-file release-notes.md
          "dist/Vesper-Setup-$VESPER_VERSION-windows-x64.exe"
          "dist/Vesper-$VESPER_VERSION-macos-universal.dmg"
          "dist/Vesper-$VESPER_VERSION-linux-x64.AppImage"
          "dist/Vesper-$VESPER_VERSION-linux-x64.deb"
          dist/vesper-cli-linux-x64 dist/vesper-cli-windows-x64.exe dist/vesper-cli-macos-arm64
          dist/vesper-cli-macos-x64 dist/LICENSE dist/NOTICE dist/SHA256SUMS
